name: Keep Supabase awake

# Supabase free-tier projects are paused after about a week without API activity.
# This runs a real read against the database every 3 days so the project stays up.
on:
  schedule:
    - cron: '17 4 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database (retry while it wakes)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets."
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body.json -w "%{http_code}" --max-time 30 \
              "${SUPABASE_URL%/}/rest/v1/profile?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY") || code=000
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Database is awake."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Database did not answer after 5 attempts."
          exit 1
